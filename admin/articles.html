<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Articles — Janbolnews Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
.filter-bar{background:#fff;border:1px solid #e5e5e5;border-radius:10px;padding:14px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.03)}
.filter-bar select,.filter-bar input{padding:8px 12px;border:1.5px solid #e0e0e0;border-radius:7px;font-size:.84rem;font-family:'Inter',sans-serif;outline:none;color:#333;background:#fff;transition:.2s}
.filter-bar select:focus,.filter-bar input:focus{border-color:#C41E3A;box-shadow:0 0 0 3px rgba(196,30,58,.07)}
.search-wrap{position:relative;flex:1;min-width:180px}
.search-wrap i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#bbb;font-size:.8rem}
.search-wrap input{padding-left:30px;width:100%}
.bulk-bar{background:#1a1a1a;color:#fff;border-radius:8px;padding:10px 16px;display:none;align-items:center;gap:12px;margin-bottom:12px;font-size:.84rem}
.bulk-bar .bulk-count{font-weight:700;color:#ff9bb3}
.bulk-bar .bulk-actions{display:flex;gap:8px;margin-left:auto}
.tbl-wrap{background:#fff;border:1px solid #e5e5e5;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.03)}
.table{width:100%;border-collapse:collapse;font-size:.83rem}
.table th{padding:10px 14px;text-align:left;font-size:.68rem;text-transform:uppercase;letter-spacing:.6px;color:#999;font-weight:700;border-bottom:2px solid #f0f0f0;background:#fafafa;white-space:nowrap}
.table th.check-col{width:36px}
.table td{padding:11px 14px;border-bottom:1px solid #f5f5f5;color:#333;vertical-align:middle}
.table tr:hover td{background:#fdf6f7}
.table tr:last-child td{border-bottom:none}
.thumb-cell{width:52px;height:38px;border-radius:5px;background:#f0f0f0;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#ccc;font-size:.75rem;flex-shrink:0}
.thumb-cell img{width:100%;height:100%;object-fit:cover}
.title-hi{font-family:'Noto Sans Devanagari','Inter',sans-serif;font-weight:600;font-size:.86rem;color:#1a1a1a;line-height:1.3}
.title-en{font-size:.78rem;color:#888;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.views-col{font-weight:700;color:#555;font-size:.82rem}
.actions-col{display:flex;gap:6px;white-space:nowrap}
.btn-icon{width:30px;height:30px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:.78rem;cursor:pointer;border:1.5px solid #e5e5e5;background:#fff;color:#555;transition:.15s;text-decoration:none}
.btn-icon:hover{border-color:#C41E3A;color:#C41E3A}
.btn-icon.del:hover{background:#fee2e2;border-color:#C41E3A;color:#C41E3A}
.pagination{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:#fafafa;border-top:1px solid #f0f0f0;font-size:.82rem;color:#666}
.page-btns{display:flex;gap:4px}
.page-btn{width:32px;height:32px;border:1.5px solid #e5e5e5;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:.8rem;cursor:pointer;font-weight:600;color:#555;background:#fff;transition:.15s}
.page-btn:hover,.page-btn.active{border-color:#C41E3A;color:#C41E3A;background:#fff8f9}
.page-btn:disabled{opacity:.4;cursor:not-allowed}
.empty{text-align:center;padding:56px;color:#bbb}
.empty i{font-size:2.5rem;display:block;margin-bottom:12px;color:#e5e5e5}
.empty p{font-size:.88rem}
input[type="checkbox"]{width:15px;height:15px;cursor:pointer;accent-color:#C41E3A}
</style>
</head>
<body>
<script src="shared.js"></script>
<script>
checkAuth();
injectSidebar('articles.html');
document.getElementById('pageTitle').textContent = 'Articles';

let page = 1;
const PER_PAGE = 20;
let totalPages = 1;
let allSelected = false;
let selectedIds = new Set();
let filterStatus = '', filterLang = '', filterCat = '', filterSearch = '';
let searchTimer = null;

function render() {
  const catOptions = JN_CATEGORIES.map(c => `<option value="${c.value}">${c.label} / ${c.labelHi}</option>`).join('');
  document.getElementById('pageBody').innerHTML = `
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
    <div style="font-size:.88rem;color:#666;" id="resultCount">Loading…</div>
    <a href="article-edit.html" class="btn btn-red"><i class="fa-solid fa-plus"></i> New Article</a>
  </div>

  <div class="filter-bar">
    <div class="search-wrap">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchInput" placeholder="Search in Hindi or English title…" oninput="onSearch(this.value)">
    </div>
    <select id="statusFilter" onchange="applyFilters()">
      <option value="">All Status</option>
      <option value="published">Published</option>
      <option value="draft">Draft</option>
      <option value="scheduled">Scheduled</option>
    </select>
    <select id="langFilter" onchange="applyFilters()">
      <option value="">All Languages</option>
      <option value="hi">हिंदी</option>
      <option value="en">English</option>
      <option value="both">Both</option>
    </select>
    <select id="catFilter" onchange="applyFilters()">
      <option value="">All Categories</option>
      ${catOptions}
    </select>
    <button class="btn btn-outline btn-sm" onclick="clearFilters()"><i class="fa-solid fa-xmark"></i> Clear</button>
  </div>

  <div class="bulk-bar" id="bulkBar">
    <span><span class="bulk-count" id="bulkCount">0</span> selected</span>
    <div class="bulk-actions">
      <button class="btn btn-sm" style="background:#16a34a;color:#fff;border:none;" onclick="bulkPublish()"><i class="fa-solid fa-check"></i> Publish</button>
      <button class="btn btn-sm" style="background:#C41E3A;color:#fff;border:none;" onclick="bulkDelete()"><i class="fa-solid fa-trash"></i> Delete</button>
      <button class="btn btn-outline btn-sm" onclick="clearSelection()"><i class="fa-solid fa-xmark"></i> Cancel</button>
    </div>
  </div>

  <div class="tbl-wrap">
    <table class="table">
      <thead>
        <tr>
          <th class="check-col"><input type="checkbox" id="selectAll" onchange="toggleSelectAll(this.checked)"></th>
          <th style="width:52px;">Img</th>
          <th>Title (Hindi / English)</th>
          <th>Category</th>
          <th>Lang</th>
          <th>Status</th>
          <th>Views</th>
          <th>Date</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="articlesTbody"><tr><td colspan="9" class="empty"><i class="fa-solid fa-spinner fa-spin"></i></td></tr></tbody>
    </table>
    <div class="pagination">
      <span id="pageInfo">Page 1 of 1</span>
      <div class="page-btns" id="pageBtns"></div>
    </div>
  </div>`;

  loadArticles();
}

function onSearch(val) {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { filterSearch = val; page = 1; loadArticles(); }, 350);
}

function applyFilters() {
  filterStatus = document.getElementById('statusFilter').value;
  filterLang   = document.getElementById('langFilter').value;
  filterCat    = document.getElementById('catFilter').value;
  page = 1;
  loadArticles();
}

function clearFilters() {
  filterStatus = filterLang = filterCat = filterSearch = '';
  document.getElementById('statusFilter').value = '';
  document.getElementById('langFilter').value = '';
  document.getElementById('catFilter').value = '';
  document.getElementById('searchInput').value = '';
  page = 1;
  loadArticles();
}

async function loadArticles() {
  const tbody = document.getElementById('articlesTbody');
  tbody.innerHTML = '<tr><td colspan="9" class="empty"><i class="fa-solid fa-spinner fa-spin" style="font-size:1.2rem;"></i></td></tr>';

  let extra = `&limit=${PER_PAGE}&page=${page}`;
  if (filterStatus) extra += `&status=${filterStatus}`;
  if (filterLang)   extra += `&lang=${filterLang}`;
  if (filterCat)    extra += `&category=${filterCat}`;
  if (filterSearch) extra += `&search=${encodeURIComponent(filterSearch)}`;

  try {
    const data = await apiFetch('articles', {}, extra);
    const articles = data.data?.articles || [];
    const total = data.data?.total || 0;
    totalPages = Math.max(1, Math.ceil(total / PER_PAGE));

    document.getElementById('resultCount').textContent = `${total.toLocaleString('en-IN')} articles found`;
    document.getElementById('pageInfo').textContent = `Page ${page} of ${totalPages}`;
    renderPageBtns();

    if (!articles.length) {
      tbody.innerHTML = `<tr><td colspan="9"><div class="empty"><i class="fa-solid fa-newspaper"></i><p>No articles found. <a href="article-edit.html" style="color:#C41E3A;font-weight:700;">Create one →</a></p></div></td></tr>`;
      return;
    }

    tbody.innerHTML = articles.map(a => {
      const checked = selectedIds.has(a.id) ? 'checked' : '';
      const dateStr = a.published_at ? formatDate(a.published_at) : (a.created_at ? formatDate(a.created_at) : '—');
      return `<tr>
        <td><input type="checkbox" value="${a.id}" ${checked} onchange="toggleSelect(${a.id}, this.checked)"></td>
        <td><div class="thumb-cell">${a.thumbnail ? `<img src="${a.thumbnail}" alt="">` : '<i class="fa-solid fa-image"></i>'}</div></td>
        <td>
          <div class="title-hi">${a.title_hi || '<span style="color:#ccc;font-family:Inter;">—</span>'}</div>
          <div class="title-en">${a.title_en || ''}</div>
        </td>
        <td>${catBadge(a.category)}</td>
        <td>${langBadge(a.lang || a.language)}</td>
        <td>${statusBadge(a.status)}</td>
        <td class="views-col">${(a.views || 0).toLocaleString('en-IN')}</td>
        <td style="font-size:.78rem;color:#999;white-space:nowrap;">${dateStr}</td>
        <td>
          <div class="actions-col">
            <a href="article-edit.html?id=${a.id}" class="btn-icon" title="Edit"><i class="fa-solid fa-pen"></i></a>
            <button class="btn-icon del" title="Delete" onclick="deleteArticle(${a.id})"><i class="fa-solid fa-trash"></i></button>
          </div>
        </td>
      </tr>`;
    }).join('');
  } catch (e) {
    tbody.innerHTML = `<tr><td colspan="9" class="empty"><i class="fa-solid fa-triangle-exclamation" style="color:#C41E3A;"></i><p>Error loading articles. Check API.</p></td></tr>`;
  }
}

function renderPageBtns() {
  const cont = document.getElementById('pageBtns');
  const btns = [];
  btns.push(`<button class="page-btn" onclick="goPage(${page-1})" ${page===1?'disabled':''} title="Previous"><i class="fa-solid fa-chevron-left"></i></button>`);
  const start = Math.max(1, page-2), end = Math.min(totalPages, page+2);
  if (start > 1) btns.push(`<button class="page-btn" onclick="goPage(1)">1</button>${start>2?'<span style="padding:0 4px;color:#ccc;">…</span>':''}`);
  for (let i=start; i<=end; i++) btns.push(`<button class="page-btn ${i===page?'active':''}" onclick="goPage(${i})">${i}</button>`);
  if (end < totalPages) btns.push(`${end<totalPages-1?'<span style="padding:0 4px;color:#ccc;">…</span>':''}<button class="page-btn" onclick="goPage(${totalPages})">${totalPages}</button>`);
  btns.push(`<button class="page-btn" onclick="goPage(${page+1})" ${page===totalPages?'disabled':''} title="Next"><i class="fa-solid fa-chevron-right"></i></button>`);
  cont.innerHTML = btns.join('');
}

function goPage(p) {
  if (p < 1 || p > totalPages) return;
  page = p;
  loadArticles();
  window.scrollTo(0,0);
}

function toggleSelect(id, checked) {
  checked ? selectedIds.add(id) : selectedIds.delete(id);
  updateBulkBar();
}

function toggleSelectAll(checked) {
  document.querySelectorAll('#articlesTbody input[type="checkbox"]').forEach(cb => {
    const id = parseInt(cb.value);
    cb.checked = checked;
    checked ? selectedIds.add(id) : selectedIds.delete(id);
  });
  updateBulkBar();
}

function updateBulkBar() {
  const bar = document.getElementById('bulkBar');
  const count = document.getElementById('bulkCount');
  if (selectedIds.size > 0) { bar.style.display = 'flex'; count.textContent = selectedIds.size; }
  else { bar.style.display = 'none'; }
}

function clearSelection() {
  selectedIds.clear();
  document.querySelectorAll('#articlesTbody input[type="checkbox"]').forEach(cb => cb.checked = false);
  document.getElementById('selectAll').checked = false;
  updateBulkBar();
}

async function deleteArticle(id) {
  if (!confirm('Delete this article? This cannot be undone.')) return;
  try {
    const r = await apiFetch('delete_article', { method: 'POST', body: JSON.stringify({ id }) });
    if (r.success) { toast('Article deleted'); selectedIds.delete(id); loadArticles(); }
    else toast(r.message || 'Delete failed', 'error');
  } catch { toast('Error deleting article', 'error'); }
}

async function bulkPublish() {
  if (!selectedIds.size) return;
  const ids = [...selectedIds];
  try {
    const r = await apiFetch('bulk_publish', { method: 'POST', body: JSON.stringify({ ids }) });
    if (r.success) { toast(`${ids.length} articles published`); clearSelection(); loadArticles(); }
    else toast(r.message || 'Bulk publish failed', 'error');
  } catch { toast('Error', 'error'); }
}

async function bulkDelete() {
  if (!selectedIds.size) return;
  if (!confirm(`Delete ${selectedIds.size} articles? This cannot be undone.`)) return;
  const ids = [...selectedIds];
  try {
    const r = await apiFetch('bulk_delete', { method: 'POST', body: JSON.stringify({ ids }) });
    if (r.success) { toast(`${ids.length} articles deleted`); clearSelection(); loadArticles(); }
    else toast(r.message || 'Bulk delete failed', 'error');
  } catch { toast('Error', 'error'); }
}

render();
</script>
</body>
</html>
