<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>E-Paper — Janbolnews Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
/* ── Edition list ── */
.ep-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.ep-header h2{font-weight:800;font-size:1.05rem;color:#1a1a1a}
.ep-table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e5e5e5;border-radius:10px;overflow:hidden}
.ep-table th{padding:10px 14px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#888;background:#fafafa;border-bottom:1px solid #efefef;text-align:left}
.ep-table td{padding:11px 14px;border-bottom:1px solid #f3f3f3;font-size:.85rem;vertical-align:middle}
.ep-table tr:last-child td{border-bottom:none}
.ep-table tr:hover td{background:#fafafa}
.ep-date{font-weight:700;color:#1a1a1a;white-space:nowrap}
.ep-title{color:#333;font-family:'Noto Sans Devanagari','Inter',sans-serif;font-size:.88rem}
.badge-pub{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:.72rem;font-weight:600;background:#dcfce7;color:#16a34a}
.badge-draft{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:.72rem;font-weight:600;background:#f3f4f6;color:#666}
.ep-actions{display:flex;gap:6px}

/* ── Create/Edit form overlay ── */
.ep-form-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:900;align-items:center;justify-content:center;padding:16px}
.ep-form-overlay.open{display:flex}
.ep-form-box{background:#fff;border-radius:14px;width:100%;max-width:820px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.2);overflow:hidden}
.ep-form-head{padding:18px 22px;border-bottom:1px solid #efefef;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.ep-form-head h3{font-weight:800;font-size:1rem;color:#1a1a1a}
.ep-form-body{display:flex;gap:0;flex:1;overflow:hidden}

/* left panel: meta */
.ep-meta-panel{width:240px;flex-shrink:0;padding:18px;border-right:1px solid #f0f0f0;display:flex;flex-direction:column;gap:14px;overflow-y:auto}

/* right panel: article picker */
.ep-picker-panel{flex:1;display:flex;flex-direction:column;overflow:hidden}
.ep-picker-head{padding:14px 18px;border-bottom:1px solid #f0f0f0;flex-shrink:0}
.ep-picker-head h4{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#888;margin-bottom:8px}
.ep-search{width:100%;padding:8px 12px;border:1.5px solid #e0e0e0;border-radius:7px;font-size:.84rem;font-family:'Inter',sans-serif;outline:none;transition:.2s}
.ep-search:focus{border-color:#C41E3A;box-shadow:0 0 0 3px rgba(196,30,58,.07)}
.ep-article-list{flex:1;overflow-y:auto;padding:8px 0}
.ep-article-item{display:flex;align-items:flex-start;gap:10px;padding:8px 18px;cursor:pointer;transition:.12s;border-bottom:1px solid #f9f9f9}
.ep-article-item:hover{background:#fafafa}
.ep-article-item input[type=checkbox]{margin-top:2px;accent-color:#C41E3A;cursor:pointer;flex-shrink:0}
.ep-article-item label{cursor:pointer;flex:1}
.ep-art-title{font-size:.84rem;font-weight:600;color:#1a1a1a;line-height:1.3;font-family:'Noto Sans Devanagari','Inter',sans-serif}
.ep-art-meta{font-size:.72rem;color:#aaa;margin-top:2px}
.ep-picker-foot{padding:10px 18px;border-top:1px solid #f0f0f0;font-size:.8rem;color:#888;background:#fafafa;flex-shrink:0}
.ep-picker-foot span{font-weight:700;color:#C41E3A}

.ep-form-foot{padding:14px 22px;border-top:1px solid #efefef;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:10px;background:#fafafa}
.ep-form-foot .right{display:flex;gap:8px}

/* ── fields ── */
.field{margin-bottom:0}
.field label{display:block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#555;margin-bottom:5px}
.field label span{color:#C41E3A}
.field input,.field select{width:100%;padding:9px 12px;border:1.5px solid #e0e0e0;border-radius:7px;font-size:.88rem;font-family:'Inter',sans-serif;outline:none;transition:.2s;background:#fff;color:#1a1a1a;box-sizing:border-box}
.field input:focus,.field select:focus{border-color:#C41E3A;box-shadow:0 0 0 3px rgba(196,30,58,.07)}

.empty-state{text-align:center;padding:60px 20px;color:#ccc}
.empty-state i{font-size:3rem;display:block;margin-bottom:14px}
.ep-loading{text-align:center;padding:40px;color:#aaa}
</style>
</head>
<body>
<script src="shared.js"></script>
<script>
checkAuth();
injectSidebar('epaper');
document.getElementById('pageTitle').textContent = 'E-Paper';

/* ── state ── */
let allEditions = [];
let allArticles = [];
let editingId   = null;   // null = create
let checkedIds  = new Set();

/* ── render list ── */
function render() {
  document.getElementById('pageBody').innerHTML = `
  <div class="ep-header">
    <h2>E-Paper Editions</h2>
    <button class="btn btn-red" onclick="openCreate()"><i class="fa-solid fa-plus"></i> New Edition</button>
  </div>
  <div id="editionList"><div class="ep-loading"><i class="fa-solid fa-spinner fa-spin fa-2x"></i></div></div>

  <!-- Create / Edit overlay -->
  <div class="ep-form-overlay" id="epOverlay">
    <div class="ep-form-box">
      <div class="ep-form-head">
        <h3 id="formHeading">New Edition</h3>
        <button class="btn-icon" onclick="closeOverlay()" style="color:#888"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="ep-form-body">
        <!-- left: meta -->
        <div class="ep-meta-panel">
          <div class="field">
            <label>Edition Title <span>*</span></label>
            <input type="text" id="epTitle" style="font-family:'Noto Sans Devanagari','Inter',sans-serif;" placeholder="जनबोल न्यूज़ — 20 जून 2026">
          </div>
          <div class="field">
            <label>Edition Date <span>*</span></label>
            <input type="date" id="epDate">
          </div>
          <div class="field">
            <label>Edition Name</label>
            <input type="text" id="epEdition" placeholder="e.g. Daily, Weekend…">
          </div>
        </div>
        <!-- right: article picker -->
        <div class="ep-picker-panel">
          <div class="ep-picker-head">
            <h4>Pick Articles</h4>
            <input type="text" class="ep-search" id="artSearch" placeholder="Search articles…" oninput="filterArticles(this.value)">
          </div>
          <div class="ep-article-list" id="artList">
            <div class="ep-loading"><i class="fa-solid fa-spinner fa-spin"></i></div>
          </div>
          <div class="ep-picker-foot" id="pickerFoot">Selected: <span>0</span> articles</div>
        </div>
      </div>
      <div class="ep-form-foot">
        <button class="btn btn-outline btn-sm" onclick="closeOverlay()">Cancel</button>
        <div class="right">
          <button class="btn btn-outline btn-sm" onclick="saveEdition('draft')" id="btnDraft">
            <i class="fa-solid fa-floppy-disk"></i> Save Draft
          </button>
          <button class="btn btn-red btn-sm" onclick="saveEdition('published')" id="btnPublish">
            <i class="fa-solid fa-newspaper"></i> Publish Edition
          </button>
        </div>
      </div>
    </div>
  </div>`;

  loadEditions();
}

/* ── list ── */
async function loadEditions() {
  try {
    const r = await apiFetch('/admin/epapers');
    allEditions = r.data?.items || [];
    renderList();
  } catch {
    document.getElementById('editionList').innerHTML = '<div class="empty-state"><i class="fa-solid fa-triangle-exclamation" style="color:#C41E3A;"></i><p>Error loading editions.</p></div>';
  }
}

function renderList() {
  const el = document.getElementById('editionList');
  if (!allEditions.length) {
    el.innerHTML = '<div class="empty-state"><i class="fa-solid fa-newspaper"></i><p style="color:#999;font-size:.9rem;">No editions yet. Create the first one.</p></div>';
    return;
  }
  el.innerHTML = `<table class="ep-table">
    <thead><tr>
      <th>Date</th><th>Title</th><th>Articles</th><th>Status</th><th>Actions</th>
    </tr></thead>
    <tbody>${allEditions.map(e => `<tr>
      <td class="ep-date">${formatDate(e.edition_date)}</td>
      <td class="ep-title">${e.title || '—'}</td>
      <td style="color:#666;">${e.article_count} articles</td>
      <td>${e.status === 'published'
        ? '<span class="badge-pub"><i class="fa-solid fa-circle" style="font-size:.45rem;"></i> Published</span>'
        : '<span class="badge-draft"><i class="fa-solid fa-circle" style="font-size:.45rem;"></i> Draft</span>'}</td>
      <td><div class="ep-actions">
        <button class="btn-icon" title="Edit" onclick="openEdit(${e.id})"><i class="fa-solid fa-pen"></i></button>
        ${getRole() === 'super' ? `<button class="btn-icon danger" title="Delete" onclick="deleteEdition(${e.id})"><i class="fa-solid fa-trash"></i></button>` : ''}
      </div></td>
    </tr>`).join('')}</tbody>
  </table>`;
}

function formatDate(d) {
  if (!d) return '—';
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('hi-IN', { day:'numeric', month:'short', year:'numeric' });
}

/* ── open create ── */
function openCreate() {
  editingId = null;
  checkedIds = new Set();
  document.getElementById('formHeading').textContent = 'New Edition';
  document.getElementById('epTitle').value = todayTitle();
  document.getElementById('epDate').value = new Date().toISOString().split('T')[0];
  document.getElementById('epEdition').value = '';
  document.getElementById('epOverlay').classList.add('open');
  loadArticlePicker(null);
}

/* ── open edit ── */
async function openEdit(id) {
  editingId = id;
  checkedIds = new Set();
  document.getElementById('formHeading').textContent = 'Edit Edition';
  document.getElementById('epOverlay').classList.add('open');
  document.getElementById('artList').innerHTML = '<div class="ep-loading"><i class="fa-solid fa-spinner fa-spin"></i></div>';

  try {
    const r = await apiFetch(`/admin/epapers/${id}`);
    const e = r.data;
    document.getElementById('epTitle').value = e.title || '';
    document.getElementById('epDate').value = e.edition_date || '';
    document.getElementById('epEdition').value = e.edition || '';
    (e.articles || []).forEach(a => checkedIds.add(a.id));
    loadArticlePicker(null);
  } catch {
    toast('Failed to load edition', 'error');
    closeOverlay();
  }
}

function closeOverlay() {
  document.getElementById('epOverlay').classList.remove('open');
  document.getElementById('artSearch').value = '';
}

function todayTitle() {
  const d = new Date();
  const months = ['जनवरी','फ़रवरी','मार्च','अप्रैल','मई','जून','जुलाई','अगस्त','सितंबर','अक्टूबर','नवंबर','दिसंबर'];
  return `जनबोल न्यूज़ — ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

/* ── article picker ── */
async function loadArticlePicker(searchQ) {
  if (!allArticles.length) {
    try {
      const r = await apiFetch('/admin/articles?status=published&limit=200');
      allArticles = r.data?.items || [];
    } catch {
      document.getElementById('artList').innerHTML = '<div class="ep-loading" style="color:#C41E3A;">Error loading articles.</div>';
      return;
    }
  }
  renderArticlePicker(allArticles);
}

function filterArticles(q) {
  const lower = q.toLowerCase();
  const filtered = q
    ? allArticles.filter(a =>
        (a.title_hi||'').toLowerCase().includes(lower) ||
        (a.title_en||'').toLowerCase().includes(lower) ||
        (a.category_name_hi||a.category||'').toLowerCase().includes(lower))
    : allArticles;
  renderArticlePicker(filtered);
}

function renderArticlePicker(articles) {
  const list = document.getElementById('artList');
  if (!articles.length) {
    list.innerHTML = '<div class="ep-loading" style="color:#bbb;">No published articles found.</div>';
    updatePickerCount();
    return;
  }
  list.innerHTML = articles.map(a => `
    <label class="ep-article-item">
      <input type="checkbox" value="${a.id}" ${checkedIds.has(a.id) ? 'checked' : ''} onchange="toggleArticle(${a.id}, this.checked)">
      <div>
        <div class="ep-art-title">${a.title_hi || a.title_en || '—'}</div>
        <div class="ep-art-meta">${a.category_name_hi || a.category || ''} ${a.title_en ? '· ' + a.title_en.substring(0,50) : ''}</div>
      </div>
    </label>`).join('');
  updatePickerCount();
}

function toggleArticle(id, checked) {
  checked ? checkedIds.add(id) : checkedIds.delete(id);
  updatePickerCount();
}

function updatePickerCount() {
  const foot = document.getElementById('pickerFoot');
  if (foot) foot.innerHTML = `Selected: <span>${checkedIds.size}</span> article${checkedIds.size !== 1 ? 's' : ''}`;
}

/* ── save ── */
async function saveEdition(status) {
  const title = document.getElementById('epTitle').value.trim();
  const date  = document.getElementById('epDate').value;
  if (!title) { toast('Title is required', 'error'); return; }
  if (!date)  { toast('Edition date is required', 'error'); return; }

  const btnId = status === 'published' ? 'btnPublish' : 'btnDraft';
  const btn = document.getElementById(btnId);
  const orig = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';

  try {
    const payload = {
      title,
      edition_date: date,
      edition:     document.getElementById('epEdition').value.trim() || 'main',
      status,
      article_ids: [...checkedIds],
    };

    const r = editingId
      ? await apiFetch(`/admin/epapers/${editingId}`, { method: 'POST', body: JSON.stringify({...payload, _method:'PUT'}), headers:{'Content-Type':'application/json'} })
      : await apiFetch('/admin/epapers', { method: 'POST', body: JSON.stringify(payload), headers:{'Content-Type':'application/json'} });

    if (r.success) {
      toast(status === 'published' ? 'Edition published!' : 'Saved as draft');
      closeOverlay();
      loadEditions();
    } else {
      toast(r.message || 'Save failed', 'error');
    }
  } catch(e) {
    toast('Error: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = orig;
  }
}

/* ── delete ── */
async function deleteEdition(id) {
  if (!confirm('Delete this edition?')) return;
  try {
    const r = await apiFetch(`/admin/epapers/${id}`, { method: 'DELETE' });
    if (r.success) { toast('Edition deleted'); loadEditions(); }
    else toast(r.message || 'Delete failed', 'error');
  } catch { toast('Error', 'error'); }
}

render();
</script>
</body>
</html>
