<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edit Article — Janbolnews Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
.edit-layout{display:grid;grid-template-columns:1fr 280px;gap:18px;align-items:start}
.lang-tabs{display:flex;gap:0;border:1.5px solid #e5e5e5;border-radius:8px;overflow:hidden;margin-bottom:16px;width:fit-content;background:#f8f8f8}
.lang-tab{padding:9px 20px;font-size:.85rem;font-weight:700;cursor:pointer;border:none;background:transparent;transition:.15s;color:#777;font-family:'Inter',sans-serif}
.lang-tab:hover{color:#C41E3A}
.lang-tab.active{background:#C41E3A;color:#fff}
.section-card{background:#fff;border:1px solid #e5e5e5;border-radius:10px;margin-bottom:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.03)}
.section-head{padding:12px 16px;border-bottom:1px solid #f0f0f0;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#888;background:#fafafa;display:flex;align-items:center;gap:7px}
.section-head i{color:#C41E3A}
.section-body{padding:16px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{margin-bottom:14px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#555;margin-bottom:5px}
.field label span{color:#C41E3A}
.field input,.field select,.field textarea{width:100%;padding:9px 12px;border:1.5px solid #e0e0e0;border-radius:7px;font-size:.9rem;font-family:'Inter',sans-serif;outline:none;transition:.2s;background:#fff;color:#1a1a1a}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#C41E3A;box-shadow:0 0 0 3px rgba(196,30,58,.07)}
.field textarea{resize:vertical;min-height:80px;line-height:1.5}
.hindi-input{font-family:'Noto Sans Devanagari','Inter',sans-serif;font-size:1rem!important}
.title-input{font-size:1.1rem!important;font-weight:700}
.slug-wrap{position:relative}
.slug-wrap input{padding-right:80px}
.slug-regen{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:#f0f0f0;border:none;border-radius:5px;padding:4px 10px;font-size:.72rem;font-weight:700;cursor:pointer;color:#555;transition:.15s}
.slug-regen:hover{background:#C41E3A;color:#fff}
/* Toolbar */
.toolbar{display:flex;gap:4px;padding:8px 10px;background:#f8f8f8;border-bottom:1px solid #e5e5e5;flex-wrap:wrap}
.tb-btn{width:30px;height:30px;border:1.5px solid #e0e0e0;border-radius:6px;background:#fff;cursor:pointer;font-size:.82rem;font-weight:700;color:#444;display:flex;align-items:center;justify-content:center;transition:.15s;font-family:Georgia,serif}
.tb-btn:hover{border-color:#C41E3A;color:#C41E3A;background:#fff8f9}
.tb-sep{width:1px;background:#e5e5e5;margin:0 4px;align-self:stretch}
.content-area{width:100%;min-height:320px;padding:14px;border:none;outline:none;font-size:.95rem;line-height:1.75;font-family:'Noto Sans Devanagari','Inter',sans-serif;color:#1a1a1a;resize:vertical;background:#fff}
/* Image upload */
.img-upload-area{border:2px dashed #e0e0e0;border-radius:9px;padding:28px;text-align:center;cursor:pointer;transition:.2s;background:#fafafa;position:relative}
.img-upload-area:hover,.img-upload-area.drag-over{border-color:#C41E3A;background:rgba(196,30,58,.03)}
.img-upload-area i{font-size:1.8rem;color:#ccc;display:block;margin-bottom:8px}
.img-upload-area p{font-size:.82rem;color:#999}
.img-preview{width:100%;height:160px;object-fit:cover;border-radius:7px;display:none;margin-top:10px}
.img-preview.show{display:block}
/* Sidebar widgets */
.sb-widget{background:#fff;border:1px solid #e5e5e5;border-radius:10px;margin-bottom:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.03)}
.sb-widget-head{padding:11px 14px;border-bottom:1px solid #f0f0f0;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#888;background:#fafafa;display:flex;align-items:center;gap:7px}
.sb-widget-head i{color:#C41E3A}
.sb-widget-body{padding:14px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f5f5f5;font-size:.85rem;color:#333}
.toggle-row:last-child{border-bottom:none}
.toggle{position:relative;width:38px;height:22px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:#e0e0e0;border-radius:22px;cursor:pointer;transition:.25s}
.toggle-slider::before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.25s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.toggle input:checked + .toggle-slider{background:#C41E3A}
.toggle input:checked + .toggle-slider::before{left:19px}
.save-bar{background:#fff;border:1px solid #e5e5e5;border-radius:10px;padding:14px;display:flex;gap:10px;flex-direction:column;box-shadow:0 1px 3px rgba(0,0,0,.03);margin-bottom:12px}
.btn-save-draft{background:#f0f0f0;color:#444;border:none;border-radius:7px;padding:11px;font-weight:700;font-size:.88rem;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:7px;width:100%}
.btn-save-draft:hover{background:#e5e5e5}
.btn-publish{background:#C41E3A;color:#fff;border:none;border-radius:7px;padding:11px;font-weight:700;font-size:.88rem;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:7px;width:100%}
.btn-publish:hover{background:#a01830}
.shortcut-hint{font-size:.7rem;color:#aaa;text-align:center;margin-top:4px}
/* Tags */
.tags-wrap{display:flex;flex-wrap:wrap;gap:5px;padding:6px 10px;border:1.5px solid #e0e0e0;border-radius:7px;min-height:40px;cursor:text;transition:.2s;background:#fff}
.tags-wrap:focus-within{border-color:#C41E3A;box-shadow:0 0 0 3px rgba(196,30,58,.07)}
.tag-chip{display:flex;align-items:center;gap:4px;background:#f0f0f0;border-radius:5px;padding:3px 8px;font-size:.78rem;color:#444;font-weight:600}
.tag-chip button{background:none;border:none;cursor:pointer;color:#999;font-size:.75rem;padding:0;line-height:1;transition:.15s}
.tag-chip button:hover{color:#C41E3A}
.tags-input{border:none;outline:none;font-size:.85rem;flex:1;min-width:80px;font-family:'Inter',sans-serif;background:transparent;color:#333}
.char-count{font-size:.72rem;color:#aaa;text-align:right;margin-top:2px}
</style>
</head>
<body>
<script src="shared.js"></script>
<script>
checkAuth();
injectSidebar('articles');

const urlParams = new URLSearchParams(window.location.search);
const articleId = urlParams.get('id');
const isEdit = !!articleId;
document.getElementById('pageTitle').textContent = isEdit ? 'Edit Article' : 'New Article';

// State
let tags = [];
let featuredImageFile = null;
let featuredImageUrl = '';
let activeTab = 'hi'; // hi | en | both
let saving = false;

async function loadCategoryOptions() {
  try {
    const isLocal2 = ['localhost','127.0.0.1'].includes(window.location.hostname);
    const base = isLocal2 ? 'http://localhost:8000/api' : '/api';
    const data = await fetch(`${base}/admin/categories`, {
      headers: { 'Authorization': `Bearer ${getToken()}`, 'Accept': 'application/json' }
    }).then(r => r.json());
    const cats = data.data || [];
    const sel = document.getElementById('category');
    if (sel) {
      const blank = sel.options[0];
      sel.innerHTML = '';
      sel.appendChild(blank || Object.assign(document.createElement('option'), { value: '', textContent: '— Select Category —' }));
      const allowedCats = getAllowedCategories();
      cats.filter(c => allowedCats === null || allowedCats.includes(c.slug))
          .forEach(c => sel.appendChild(Object.assign(document.createElement('option'), { value: c.id, textContent: `${c.name_hi} / ${c.name_en}` })));
    }
    const authorInput = document.getElementById('authorName');
    if (authorInput && !authorInput.value) {
      authorInput.value = getUser()?.name || '';
    }
  } catch (e) { /* keep hardcoded fallback */ }
}

function render() {
  const catOptions = JN_CATEGORIES.map(c => `<option value="${c.value}">${c.labelHi} / ${c.label}</option>`).join('');
  document.getElementById('pageBody').innerHTML = `
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
    <div class="lang-tabs">
      <button class="lang-tab ${activeTab==='hi'?'active':''}" onclick="setTab('hi')">हिंदी</button>
      <button class="lang-tab ${activeTab==='en'?'active':''}" onclick="setTab('en')">English</button>
      <button class="lang-tab ${activeTab==='both'?'active':''}" onclick="setTab('both')">दोनों</button>
    </div>
    <a href="articles" class="btn btn-outline btn-sm"><i class="fa-solid fa-arrow-left"></i> Back to Articles</a>
  </div>

  <div class="edit-layout">
    <!-- Main content -->
    <div>
      <!-- Titles + Meta -->
      <div class="section-card">
        <div class="section-head"><i class="fa-solid fa-heading"></i> Article Details</div>
        <div class="section-body">
          <div class="${activeTab==='en'?'':''}">
            <div class="field ${activeTab==='en'?'hidden-field':''}" id="fieldTitleHi">
              <label>Title (Hindi) <span>*</span></label>
              <input type="text" id="titleHi" class="title-input hindi-input" placeholder="समाचार का शीर्षक यहाँ लिखें…" oninput="autoSlug()">
              <div class="char-count" id="titleHiCount">0 chars</div>
            </div>
            <div class="field ${activeTab==='hi'?'hidden-field':''}" id="fieldTitleEn">
              <label>Title (English)</label>
              <input type="text" id="titleEn" class="title-input" placeholder="Write article headline in English…">
              <div class="char-count" id="titleEnCount">0 chars</div>
            </div>
          </div>
          <div class="field">
            <label>Slug (URL)</label>
            <div class="slug-wrap">
              <input type="text" id="slug" placeholder="article-url-slug">
              <button class="slug-regen" onclick="regenSlug()"><i class="fa-solid fa-wand-magic-sparkles"></i> Auto</button>
            </div>
          </div>
          <div class="form-row">
            <div class="field">
              <label>Category</label>
              <select id="category">
                <option value="">Select Category</option>
                ${catOptions}
              </select>
            </div>
            <div class="field">
              <label>Author</label>
              <input type="text" id="authorName" placeholder="लेखक का नाम लिखें…">
            </div>
          </div>
          <div class="field">
            <label>Tags (press Enter or comma to add)</label>
            <div class="tags-wrap" id="tagsWrap" onclick="document.getElementById('tagInput').focus()">
              <input type="text" id="tagInput" class="tags-input" placeholder="Add tags…" onkeydown="handleTagInput(event)">
            </div>
          </div>
        </div>
      </div>

      <!-- Featured Image -->
      <div class="section-card">
        <div class="section-head"><i class="fa-solid fa-image"></i> Featured Image</div>
        <div class="section-body">
          <div class="img-upload-area" id="imgDropArea" onclick="document.getElementById('imgFileInput').click()" ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event)">
            <i class="fa-solid fa-cloud-arrow-up"></i>
            <p><strong>Click to upload</strong> or drag & drop here</p>
            <p style="margin-top:4px;font-size:.75rem;color:#bbb;">JPG, PNG, WebP — max 5MB</p>
          </div>
          <img id="imgPreview" class="img-preview" alt="Preview">
          <input type="file" id="imgFileInput" accept="image/*" style="display:none" onchange="handleImageSelect(this)">
          <div class="field" style="margin-top:12px;margin-bottom:0">
            <label>Or paste image URL</label>
            <input type="url" id="imgUrl" placeholder="https://…" oninput="onImgUrlInput(this.value)">
          </div>
        </div>
      </div>

      <!-- Content Editor -->
      <div class="section-card">
        <div class="section-head"><i class="fa-solid fa-align-left"></i> Content</div>
        <div>
          <div class="toolbar">
            <button class="tb-btn" onclick="fmt('bold')" title="Bold"><b>B</b></button>
            <button class="tb-btn" onclick="fmt('italic')" title="Italic"><i>I</i></button>
            <button class="tb-btn" onclick="fmtWrap('<u>','</u>')" title="Underline"><u>U</u></button>
            <div class="tb-sep"></div>
            <button class="tb-btn" onclick="fmtWrap('\n<h2>','</h2>\n')" title="Heading 2" style="font-size:.75rem;">H2</button>
            <button class="tb-btn" onclick="fmtWrap('\n<h3>','</h3>\n')" title="Heading 3" style="font-size:.75rem;">H3</button>
            <div class="tb-sep"></div>
            <button class="tb-btn" onclick="insertList('ul')" title="Bullet List"><i class="fa-solid fa-list-ul"></i></button>
            <button class="tb-btn" onclick="insertList('ol')" title="Numbered List"><i class="fa-solid fa-list-ol"></i></button>
            <button class="tb-btn" onclick="fmtWrap('\n<blockquote>','</blockquote>\n')" title="Blockquote"><i class="fa-solid fa-quote-left"></i></button>
            <div class="tb-sep"></div>
            <button class="tb-btn" onclick="insertLink()" title="Insert Link"><i class="fa-solid fa-link"></i></button>
            <button class="tb-btn" onclick="insertImgTag()" title="Insert Image"><i class="fa-solid fa-image"></i></button>
            <button class="tb-btn" onclick="insertYoutube()" title="Embed YouTube"><i class="fa-brands fa-youtube" style="color:#ff0000;"></i></button>
            <div class="tb-sep"></div>
            <button class="tb-btn" onclick="fmtWrap('\n<hr>\n','')" title="Horizontal Rule" style="font-size:.75rem;">—</button>
            <button class="tb-btn" onclick="clearContent()" title="Clear" style="color:#C41E3A;"><i class="fa-solid fa-xmark"></i></button>
          </div>
          <textarea class="content-area hindi-input" id="contentHi" placeholder="समाचार की सामग्री यहाँ लिखें…" style="${activeTab==='en'?'display:none':''}" oninput="countChars('contentHi','charCountHi')"></textarea>
          <textarea class="content-area" id="contentEn" placeholder="Write article content in English…" style="${activeTab==='hi'?'display:none':''}" oninput="countChars('contentEn','charCountEn')"></textarea>
          <div style="display:flex;justify-content:flex-end;padding:6px 12px;background:#fafafa;border-top:1px solid #f0f0f0;font-size:.72rem;color:#aaa;gap:12px;">
            <span id="charCountHi">0 chars</span>
            <span id="charCountEn" style="${activeTab==='hi'?'display:none':''}">0 chars (EN)</span>
          </div>
        </div>
      </div>

      <!-- Excerpts -->
      <div class="section-card">
        <div class="section-head"><i class="fa-solid fa-file-lines"></i> Excerpt / Summary</div>
        <div class="section-body">
          <div class="field ${activeTab==='en'?'hidden-field':''}">
            <label>Excerpt (Hindi)</label>
            <textarea id="excerptHi" class="hindi-input" placeholder="संक्षिप्त विवरण (160 अक्षर तक)…" rows="2" maxlength="300"></textarea>
          </div>
          <div class="field ${activeTab==='hi'?'hidden-field':''}">
            <label>Excerpt (English)</label>
            <textarea id="excerptEn" placeholder="Brief description in English (max 160 chars)…" rows="2" maxlength="300" style="margin-bottom:0"></textarea>
          </div>
        </div>
      </div>
    </div>

    <!-- Right Sidebar -->
    <div>
      <!-- Save actions -->
      <div class="save-bar">
        <button class="btn-publish" onclick="saveArticle('published')" id="btnPublish">
          <i class="fa-solid fa-paper-plane"></i> Publish Now
        </button>
        <button class="btn-save-draft" onclick="saveArticle('draft')" id="btnDraft">
          <i class="fa-solid fa-floppy-disk"></i> Save Draft
        </button>
        <div class="shortcut-hint">Ctrl+Enter to publish</div>
      </div>

      <!-- Status -->
      <div class="sb-widget">
        <div class="sb-widget-head"><i class="fa-solid fa-toggle-on"></i> Status & Visibility</div>
        <div class="sb-widget-body">
          <div class="field">
            <label>Status</label>
            <select id="status">
              <option value="draft">Draft</option>
              <option value="published">Published</option>
              <option value="scheduled">Scheduled</option>
            </select>
          </div>
          <div class="field" id="scheduleGroup" style="display:none">
            <label>Publish Date & Time</label>
            <input type="datetime-local" id="scheduledAt">
          </div>
          <div class="field">
            <label>Language</label>
            <select id="langSelect">
              <option value="hi">हिंदी Only</option>
              <option value="en">English Only</option>
              <option value="both">Both (Bilingual)</option>
            </select>
          </div>
          <div class="toggle-row">
            <span>Is Featured</span>
            <label class="toggle"><input type="checkbox" id="isFeatured"><span class="toggle-slider"></span></label>
          </div>
          <div class="toggle-row">
            <span>Is Breaking</span>
            <label class="toggle"><input type="checkbox" id="isBreaking"><span class="toggle-slider"></span></label>
          </div>
        </div>
      </div>

      <!-- SEO -->
      <div class="sb-widget">
        <div class="sb-widget-head"><i class="fa-solid fa-chart-line"></i> SEO</div>
        <div class="sb-widget-body">
          <div class="field">
            <label>Meta Title (EN)</label>
            <input type="text" id="metaTitle" placeholder="SEO title…" maxlength="70">
          </div>
          <div class="field">
            <label>Meta Description</label>
            <textarea id="metaDesc" placeholder="Meta description for search engines…" rows="3" maxlength="160" style="margin-bottom:0;resize:none"></textarea>
          </div>
        </div>
      </div>

      <!-- Article info (edit mode) -->
      ${isEdit ? `<div class="sb-widget" id="articleInfo">
        <div class="sb-widget-head"><i class="fa-solid fa-circle-info"></i> Article Info</div>
        <div class="sb-widget-body" style="font-size:.8rem;color:#666;line-height:1.9;">
          <div>ID: <strong id="infoId">—</strong></div>
          <div>Created: <strong id="infoCreated">—</strong></div>
          <div>Views: <strong id="infoViews">—</strong></div>
        </div>
      </div>` : ''}
    </div>
  </div>`;

  // Event listeners
  document.getElementById('status').addEventListener('change', function() {
    document.getElementById('scheduleGroup').style.display = this.value === 'scheduled' ? 'block' : 'none';
  });
  document.getElementById('langSelect').addEventListener('change', function() {
    setTab(this.value === 'hi' ? 'hi' : this.value === 'en' ? 'en' : 'both');
  });
  document.getElementById('titleHi').addEventListener('input', function() {
    document.getElementById('titleHiCount').textContent = this.value.length + ' chars';
  });
  document.getElementById('titleEn').addEventListener('input', function() {
    document.getElementById('titleEnCount').textContent = this.value.length + ' chars';
  });

  // Keyboard shortcut
  document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); saveArticle('published'); }
  });

}

function setTab(tab) {
  activeTab = tab;
  // Update tab buttons
  document.querySelectorAll('.lang-tab').forEach((el, i) => {
    el.classList.toggle('active', ['hi','en','both'][i] === tab);
  });
  // Show/hide content areas
  const hi = document.getElementById('contentHi');
  const en = document.getElementById('contentEn');
  if (hi && en) {
    hi.style.display = tab === 'en' ? 'none' : '';
    en.style.display = tab === 'hi' ? 'none' : '';
    document.getElementById('charCountEn').style.display = tab === 'hi' ? 'none' : '';
  }
  // Sync lang select
  const ls = document.getElementById('langSelect');
  if (ls) ls.value = tab;
}

function countChars(textareaId, countId) {
  const ta = document.getElementById(textareaId);
  const cnt = document.getElementById(countId);
  if (ta && cnt) cnt.textContent = ta.value.length + ' chars' + (textareaId.endsWith('En') ? ' (EN)' : '');
}

// ── Slug auto-generation ──────────────────────────────────────────
function autoSlug() {
  if (document.getElementById('slug').dataset.manual) return;
  const titleEn = document.getElementById('titleEn').value;
  const titleHi = document.getElementById('titleHi').value;
  const source = titleEn || titleHi;
  if (source) document.getElementById('slug').value = generateSlug(source);
}

function regenSlug() {
  const titleHi = document.getElementById('titleHi').value;
  const titleEn = document.getElementById('titleEn').value;
  const title = titleEn || titleHi;
  document.getElementById('slug').value = generateSlug(title);
  document.getElementById('slug').dataset.manual = '';
}

function generateSlug(str) {
  // Transliterate common Hindi chars or just use EN title
  return str.toLowerCase()
    .replace(/[^\w\s-]/g, '')
    .replace(/\s+/g, '-')
    .replace(/-+/g, '-')
    .replace(/^-|-$/g, '')
    .substring(0, 80) || 'article-' + Date.now();
}

document.getElementById && document.getElementById('slug') && document.getElementById('slug').addEventListener('input', function() {
  this.dataset.manual = '1';
});

// ── Tags ─────────────────────────────────────────────────────────
function handleTagInput(e) {
  const input = e.target;
  if (e.key === 'Enter' || e.key === ',') {
    e.preventDefault();
    const val = input.value.replace(',','').trim();
    if (val && !tags.includes(val)) {
      tags.push(val);
      renderTags();
    }
    input.value = '';
  } else if (e.key === 'Backspace' && !input.value && tags.length) {
    tags.pop();
    renderTags();
  }
}

function renderTags() {
  const wrap = document.getElementById('tagsWrap');
  const input = document.getElementById('tagInput');
  const chips = tags.map((t,i) => `<span class="tag-chip">${t}<button onclick="removeTag(${i})" title="Remove">&times;</button></span>`).join('');
  wrap.innerHTML = chips;
  wrap.appendChild(input);
  input.focus();
}

function removeTag(i) {
  tags.splice(i, 1);
  renderTags();
}

// ── Image upload ──────────────────────────────────────────────────
function onDragOver(e) { e.preventDefault(); document.getElementById('imgDropArea').classList.add('drag-over'); }
function onDragLeave(e) { document.getElementById('imgDropArea').classList.remove('drag-over'); }
function onDrop(e) {
  e.preventDefault();
  document.getElementById('imgDropArea').classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) handleImageFile(file);
}
function handleImageSelect(input) { if (input.files[0]) handleImageFile(input.files[0]); }
function handleImageFile(file) {
  if (file.size > 5 * 1024 * 1024) { toast('Image too large (max 5MB)', 'error'); return; }
  featuredImageFile = file;
  featuredImageUrl = '';
  document.getElementById('imgUrl').value = '';
  const url = URL.createObjectURL(file);
  showImagePreview(url);
  document.getElementById('imgDropArea').innerHTML = `<i class="fa-solid fa-check" style="color:#16a34a;"></i><p><strong>${file.name}</strong></p><p style="font-size:.73rem;color:#aaa;">${(file.size/1024).toFixed(0)} KB</p>`;
}
function onImgUrlInput(val) {
  featuredImageFile = null;
  featuredImageUrl = val;
  if (val) showImagePreview(val);
  else { document.getElementById('imgPreview').className = 'img-preview'; }
}
function showImagePreview(url) {
  const img = document.getElementById('imgPreview');
  img.src = url;
  img.className = 'img-preview show';
}

// ── Toolbar formatting ────────────────────────────────────────────
function getActiveEditor() {
  const hiEl = document.getElementById('contentHi');
  const enEl = document.getElementById('contentEn');
  if (activeTab === 'en') return enEl;
  return hiEl;
}

function fmt(command) {
  const ta = getActiveEditor();
  if (!ta) return;
  const start = ta.selectionStart, end = ta.selectionEnd;
  const sel = ta.value.substring(start, end);
  const map = { bold: ['<strong>','</strong>'], italic: ['<em>','</em>'] };
  const [open, close] = map[command] || ['',''];
  const newVal = ta.value.substring(0, start) + open + sel + close + ta.value.substring(end);
  ta.value = newVal;
  ta.selectionStart = start + open.length;
  ta.selectionEnd = end + open.length;
  ta.focus();
}

function fmtWrap(open, close) {
  const ta = getActiveEditor();
  if (!ta) return;
  const start = ta.selectionStart, end = ta.selectionEnd;
  const sel = ta.value.substring(start, end);
  const newVal = ta.value.substring(0, start) + open + sel + close + ta.value.substring(end);
  ta.value = newVal;
  ta.selectionStart = start + open.length;
  ta.selectionEnd = end + open.length;
  ta.focus();
}

function insertList(type) {
  const ta = getActiveEditor();
  if (!ta) return;
  const start = ta.selectionStart, end = ta.selectionEnd;
  const sel = ta.value.substring(start, end);
  const items = sel ? sel.split('\n').map(l => `  <li>${l}</li>`).join('\n') : '  <li>Item</li>';
  const html = `\n<${type}>\n${items}\n</${type}>\n`;
  ta.value = ta.value.substring(0, start) + html + ta.value.substring(end);
  ta.focus();
}

function insertLink() {
  const url = prompt('Enter URL:');
  if (!url) return;
  const ta = getActiveEditor();
  if (!ta) return;
  const start = ta.selectionStart, end = ta.selectionEnd;
  const sel = ta.value.substring(start, end) || 'link text';
  const html = `<a href="${url}">${sel}</a>`;
  ta.value = ta.value.substring(0, start) + html + ta.value.substring(end);
  ta.focus();
}

function insertImgTag() {
  const url = prompt('Enter image URL:');
  if (!url) return;
  const alt = prompt('Alt text (optional):') || '';
  const ta = getActiveEditor();
  if (!ta) return;
  const start = ta.selectionStart;
  const html = `\n<img src="${url}" alt="${alt}" style="max-width:100%;">\n`;
  ta.value = ta.value.substring(0, start) + html + ta.value.substring(start);
  ta.focus();
}

function insertYoutube() {
  const url = prompt('Enter YouTube video URL or ID:');
  if (!url) return;
  let videoId = url;
  const match = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  if (match) videoId = match[1];
  const ta = getActiveEditor();
  if (!ta) return;
  const start = ta.selectionStart;
  const html = `\n<div class="video-wrap"><iframe width="560" height="315" src="https://www.youtube.com/embed/${videoId}" frameborder="0" allowfullscreen></iframe></div>\n`;
  ta.value = ta.value.substring(0, start) + html + ta.value.substring(start);
  ta.focus();
}

function clearContent() {
  if (!confirm('Clear all content?')) return;
  const ta = getActiveEditor();
  if (ta) ta.value = '';
}

// ── Load existing article ─────────────────────────────────────────
async function loadArticle() {
  try {
    const data = await apiFetch(`/admin/articles/${articleId}`);
    const a = data.data?.article || data.data;
    if (!a) { toast('Article not found', 'error'); return; }

    document.getElementById('titleHi').value = a.title_hi || '';
    document.getElementById('titleEn').value = a.title_en || '';
    document.getElementById('slug').value = a.slug || '';
    document.getElementById('slug').dataset.manual = '1';
    document.getElementById('category').value = a.category_id || '';
    document.getElementById('authorName').value = a.author_name || getUser()?.name || '';
    document.getElementById('contentHi').value = a.content_hi || '';
    document.getElementById('contentEn').value = a.content_en || '';
    document.getElementById('excerptHi').value = a.excerpt_hi || '';
    document.getElementById('excerptEn').value = a.excerpt_en || '';
    document.getElementById('status').value = a.status || 'draft';
    document.getElementById('langSelect').value = a.lang || a.language || 'hi';
    document.getElementById('isFeatured').checked = !!a.is_featured;
    document.getElementById('isBreaking').checked = !!a.is_breaking;
    document.getElementById('metaTitle').value = a.meta_title || '';
    document.getElementById('metaDesc').value = a.meta_description || '';

    if (a.scheduled_at) {
      document.getElementById('scheduledAt').value = a.scheduled_at.replace(' ', 'T').substring(0,16);
      document.getElementById('scheduleGroup').style.display = 'block';
    }
    if (a.featured_image_url || a.featured_image) {
      featuredImageUrl = a.featured_image_url || a.featured_image;
      document.getElementById('imgUrl').value = featuredImageUrl;
      showImagePreview(featuredImageUrl);
    }
    if (a.tags) {
      tags = Array.isArray(a.tags) ? a.tags : a.tags.split(',').map(t=>t.trim()).filter(Boolean);
      renderTags();
    }
    setTab(a.lang || a.language || 'hi');

    // Info panel
    if (document.getElementById('infoId')) {
      document.getElementById('infoId').textContent = a.id;
      document.getElementById('infoCreated').textContent = formatDate(a.created_at);
      document.getElementById('infoViews').textContent = (a.views || 0).toLocaleString('en-IN');
    }

    document.getElementById('titleHiCount').textContent = (a.title_hi||'').length + ' chars';
    document.getElementById('titleEnCount').textContent = (a.title_en||'').length + ' chars';
  } catch (e) {
    toast('Could not load article: ' + e.message, 'error');
  }
}

// ── Save ──────────────────────────────────────────────────────────
async function saveArticle(forceStatus) {
  if (saving) return;
  saving = true;

  const btnPublish = document.getElementById('btnPublish');
  const btnDraft = document.getElementById('btnDraft');
  const originalPublish = btnPublish.innerHTML;
  const originalDraft = btnDraft.innerHTML;

  if (forceStatus === 'published') {
    btnPublish.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Publishing…';
    btnPublish.disabled = true;
  } else {
    btnDraft.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving…';
    btnDraft.disabled = true;
  }

  try {
    const titleHi = document.getElementById('titleHi').value.trim();
    const titleEn = document.getElementById('titleEn').value.trim();
    const lang = document.getElementById('langSelect').value;

    if (lang !== 'en' && !titleHi) { toast('Hindi title is required', 'error'); return; }
    if (lang !== 'hi' && !titleEn) { toast('English title is required', 'error'); return; }

    const payload = {
      id: isEdit ? articleId : undefined,
      title_hi:    titleHi,
      title_en:    titleEn,
      slug:        document.getElementById('slug').value.trim() || generateSlug(titleEn || titleHi),
      category_id: document.getElementById('category').value,
      author_name: document.getElementById('authorName').value.trim() || null,
      content_hi:  document.getElementById('contentHi').value,
      content_en:  document.getElementById('contentEn').value,
      excerpt_hi:  document.getElementById('excerptHi').value,
      excerpt_en:  document.getElementById('excerptEn').value,
      status:      forceStatus || document.getElementById('status').value,
      language:    lang,
      is_featured: document.getElementById('isFeatured').checked ? 1 : 0,
      is_breaking: document.getElementById('isBreaking').checked ? 1 : 0,
      tags:        tags.join(','),
      meta_title:  document.getElementById('metaTitle').value,
      meta_description: document.getElementById('metaDesc').value,
      featured_image: featuredImageUrl,
    };

    const scheduledAt = document.getElementById('scheduledAt').value;
    if (scheduledAt && payload.status === 'scheduled') payload.scheduled_at = scheduledAt;

    // Use FormData to support optional image upload
    const fd = new FormData();
    Object.entries(payload).forEach(([k, v]) => { if (v !== undefined && v !== null) fd.append(k, v); });
    if (featuredImageFile) fd.append('featured_image', featuredImageFile);
    if (isEdit) fd.append('_method', 'PUT');

    const path = isEdit ? `/admin/articles/${articleId}` : '/admin/articles';
    const r = await apiFetch(path, { method: 'POST', body: fd });

    if (r.success) {
      toast(forceStatus === 'published' ? 'Article published!' : 'Draft saved!');
      if (!isEdit && r.data?.id) {
        window.history.replaceState({}, '', `article-edit.html?id=${r.data.id}`);
        document.getElementById('pageTitle').textContent = 'Edit Article';
      }
    } else {
      toast(r.message || 'Save failed', 'error');
    }
  } catch (e) {
    toast('Error: ' + e.message, 'error');
  } finally {
    saving = false;
    btnPublish.innerHTML = originalPublish;
    btnPublish.disabled = false;
    btnDraft.innerHTML = originalDraft;
    btnDraft.disabled = false;
  }
}

render();
loadCategoryOptions();
if (articleId) loadArticle();
</script>
