<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Janbolnews Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--red:#C41E3A;--red2:#a01830;--navy:#1a1a1a;--font:'Inter',sans-serif;--font-hi:'Noto Sans Devanagari','Inter',sans-serif}
body{font-family:var(--font);background:var(--navy);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden}
/* Newspaper texture background */
body::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 24px,rgba(255,255,255,.015) 24px,rgba(255,255,255,.015) 25px),repeating-linear-gradient(90deg,transparent,transparent 80px,rgba(255,255,255,.01) 80px,rgba(255,255,255,.01) 81px);pointer-events:none}
body::after{content:'';position:absolute;top:-40%;left:-20%;width:60%;height:120%;background:radial-gradient(ellipse,rgba(196,30,58,.12) 0%,transparent 70%);pointer-events:none}
.login-wrap{position:relative;z-index:2;width:100%;max-width:420px}
.masthead{text-align:center;margin-bottom:28px}
.masthead-logo{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;background:var(--red);border-radius:12px;margin-bottom:14px;box-shadow:0 8px 32px rgba(196,30,58,.4)}
.masthead-logo i{color:#fff;font-size:24px}
.masthead-name{font-family:var(--font-hi);font-weight:800;font-size:1.9rem;color:#fff;letter-spacing:.5px;line-height:1;text-shadow:0 2px 20px rgba(0,0,0,.4)}
.masthead-sub{font-size:.75rem;color:rgba(255,255,255,.35);margin-top:5px;letter-spacing:1.5px;text-transform:uppercase;font-family:var(--font)}
.card{background:#fff;border-radius:14px;padding:38px 36px;box-shadow:0 24px 80px rgba(0,0,0,.5);border-top:4px solid var(--red)}
.card h2{font-weight:800;font-size:1.3rem;color:var(--navy);margin-bottom:4px}
.card p{color:#666;font-size:.85rem;margin-bottom:26px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:#444;margin-bottom:6px}
.input-wrap{position:relative}
.input-wrap i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#aaa;font-size:.85rem}
.form-group input{width:100%;padding:12px 14px 12px 38px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:.95rem;font-family:var(--font);outline:none;transition:.2s;color:var(--navy)}
.form-group input:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(196,30,58,.08)}
.err{background:#fee2e2;color:var(--red);padding:11px 14px;border-radius:8px;font-size:.84rem;margin-bottom:16px;display:none;align-items:center;gap:8px;border-left:3px solid var(--red)}
.btn{width:100%;padding:13px;background:var(--red);color:#fff;border:none;border-radius:8px;font-weight:700;font-size:.95rem;cursor:pointer;font-family:var(--font);transition:.2s;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--red2)}
.btn:disabled{opacity:.65;cursor:not-allowed}
.footer-note{text-align:center;margin-top:16px;font-size:.76rem;color:rgba(255,255,255,.3)}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="masthead">
    <div class="masthead-logo"><i class="fa-solid fa-newspaper"></i></div>
    <div class="masthead-name">जनबोलन्यूज़</div>
    <div class="masthead-sub">News Admin Panel</div>
  </div>
  <div class="card">
    <h2>Admin Login</h2>
    <p>Sign in to publish and manage news</p>
    <div class="err" id="err"><i class="fa-solid fa-circle-exclamation"></i><span id="errMsg"></span></div>
    <form onsubmit="login(event)" autocomplete="on">
      <div class="form-group">
        <label>Email Address</label>
        <div class="input-wrap">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" id="email" placeholder="admin@janbolnews.com" required autocomplete="email" autofocus>
        </div>
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="input-wrap">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
        </div>
      </div>
      <button type="submit" class="btn" id="loginBtn">
        <i class="fa-solid fa-right-to-bracket"></i> Sign In
      </button>
    </form>
  </div>
  <div class="footer-note">Janbolnews &copy; 2025 &mdash; Admin Only</div>
</div>
<script>
// Redirect if already logged in
if (localStorage.getItem('jn_admin_key')) window.location.href = 'dashboard.html';

async function login(e) {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');
  const errEl = document.getElementById('err');
  const errMsg = document.getElementById('errMsg');

  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Signing in…';
  errEl.style.display = 'none';

  try {
    const res = await fetch('../api/admin.php?action=login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    const token = data.token || (data.data && data.data.token);
    if (data.success && token) {
      localStorage.setItem('jn_admin_key', token);
      window.location.href = 'dashboard.html';
    } else {
      errMsg.textContent = data.message || 'Invalid credentials. Please try again.';
      errEl.style.display = 'flex';
    }
  } catch (err) {
    errMsg.textContent = 'Connection error. Check server and try again.';
    errEl.style.display = 'flex';
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Sign In';
  }
}
</script>
</body>
</html>
