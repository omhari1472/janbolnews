<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Settings — Janbolnews Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
.settings-layout{display:grid;grid-template-columns:200px 1fr;gap:18px;align-items:start}
.settings-nav{background:#fff;border:1px solid #e5e5e5;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.03);position:sticky;top:72px}
.settings-nav a{display:flex;align-items:center;gap:9px;padding:12px 16px;font-size:.84rem;font-weight:600;color:#555;text-decoration:none;border-bottom:1px solid #f5f5f5;transition:.15s;cursor:pointer}
.settings-nav a:last-child{border-bottom:none}
.settings-nav a:hover,.settings-nav a.active{background:#fff8f9;color:#C41E3A;}
.settings-nav a i{width:16px;text-align:center;font-size:.82rem;color:#bbb;transition:.15s}
.settings-nav a:hover i,.settings-nav a.active i{color:#C41E3A}
.section-card{background:#fff;border:1px solid #e5e5e5;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.03);margin-bottom:16px}
.section-head{padding:14px 20px;border-bottom:1px solid #f0f0f0;background:#fafafa;display:flex;align-items:center;gap:8px}
.section-head h3{font-weight:800;font-size:.88rem;color:#1a1a1a;text-transform:uppercase;letter-spacing:.5px;flex:1}
.section-head i{color:#C41E3A;font-size:.85rem}
.section-body{padding:20px}
.field{margin-bottom:16px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#555;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:9px 12px;border:1.5px solid #e0e0e0;border-radius:7px;font-size:.9rem;font-family:'Inter',sans-serif;outline:none;transition:.2s;background:#fff;color:#1a1a1a}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#C41E3A;box-shadow:0 0 0 3px rgba(196,30,58,.07)}
.field .hint{font-size:.73rem;color:#aaa;margin-top:4px}
.field textarea{resize:vertical;min-height:90px;line-height:1.5;font-size:.85rem}
.hindi-input{font-family:'Noto Sans Devanagari','Inter',sans-serif;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.btn-save{background:#C41E3A;color:#fff;border:none;border-radius:7px;padding:10px 24px;font-weight:700;font-size:.88rem;cursor:pointer;font-family:'Inter',sans-serif;transition:.15s;display:inline-flex;align-items:center;gap:7px}
.btn-save:hover{background:#a01830}
.btn-save:disabled{opacity:.65;cursor:not-allowed}
.social-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.social-row:last-child{margin-bottom:0}
.social-icon{width:34px;height:34px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0}
.si-fb{background:#1877f2;color:#fff}
.si-tw{background:#000;color:#fff}
.si-yt{background:#ff0000;color:#fff}
.si-wa{background:#25d366;color:#fff}
.si-ig{background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);color:#fff}
.social-row input{flex:1;padding:9px 12px;border:1.5px solid #e0e0e0;border-radius:7px;font-size:.87rem;font-family:'Inter',sans-serif;outline:none;transition:.2s;color:#1a1a1a}
.social-row input:focus{border-color:#C41E3A;box-shadow:0 0 0 3px rgba(196,30,58,.07)}
.adsense-preview{background:#f8f8f8;border:1px dashed #ddd;border-radius:7px;padding:12px;font-size:.78rem;color:#999;font-family:'Courier New',monospace;word-break:break-all;min-height:50px;margin-top:6px}
.danger-zone{border:2px solid #fee2e2!important}
.danger-head{background:#fff8f8!important;}
.danger-head h3{color:#C41E3A!important}
.section-group{margin-bottom:22px}
.section-group[data-section]{display:none}
.section-group.active{display:block}
/* Font picker */
.font-section-label{font-weight:700;font-size:.8rem;color:#333;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.font-section-label i{color:#C41E3A}
.font-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.font-card{border:1.5px solid #e5e5e5;border-radius:9px;padding:13px 12px 11px;cursor:pointer;transition:.15s;position:relative;background:#fff;user-select:none}
.font-card:hover{border-color:#C41E3A;background:#fff8f9}
.font-card.selected{border-color:#C41E3A;background:#fff8f9}
.font-card-sample{font-size:1.1rem;font-weight:700;color:#1a1a1a;margin-bottom:5px;line-height:1.3;min-height:26px}
.font-card-name{font-size:.74rem;font-weight:700;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.font-card-cat{font-size:.66rem;color:#bbb;margin-top:1px}
.font-card-check{position:absolute;top:7px;right:7px;width:17px;height:17px;background:#C41E3A;border-radius:50%;display:none;align-items:center;justify-content:center}
.font-card.selected .font-card-check{display:flex}
.font-card-check i{color:#fff;font-size:.46rem}
.font-preview-box{background:#f8f8f8;border:1px solid #e8e8e8;border-radius:9px;padding:16px 18px;margin-bottom:18px}
.font-preview-hi{font-size:1.45rem;font-weight:700;color:#1a1a1a;margin-bottom:3px;line-height:1.3}
.font-preview-en{font-size:1.1rem;font-weight:600;color:#333;margin-bottom:8px}
.font-preview-body{font-size:.88rem;color:#666;line-height:1.65}
.font-preview-label{font-size:.68rem;color:#aaa;margin-bottom:10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px}
</style>
</head>
<body>
<script src="shared.js"></script>
<script>
checkAuth();
injectSidebar('settings');
document.getElementById('pageTitle').textContent = 'Settings';

const SECTIONS = ['profile','general','social','analytics','adsense','contact','admin'];
const isEditorRole = getRole() !== 'super';
let currentSection = 'profile';
let settingsData = {};

// ── Profile ────────────────────────────────────────────────────────────────
function loadProfileSection() {
  const user = getUser();
  if (!user) return;
  document.getElementById('profileName').value  = user.name  || '';
  document.getElementById('profileEmail').value = user.email || '';
  const preview = document.getElementById('avatarPreview');
  if (user.avatar_url) {
    preview.innerHTML = `<img src="${user.avatar_url}" style="width:100%;height:100%;object-fit:cover;">`;
  } else {
    preview.textContent = (user.name || 'A').split(' ').map(w => w[0]).slice(0,2).join('').toUpperCase();
  }
}

function previewAvatar(input) {
  if (!input.files?.[0]) return;
  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById('avatarPreview').innerHTML =
      `<img src="${e.target.result}" style="width:100%;height:100%;object-fit:cover;">`;
  };
  reader.readAsDataURL(input.files[0]);
}

async function saveProfile() {
  const name = document.getElementById('profileName').value.trim();
  if (!name) { toast('Name is required', 'error'); return; }
  const avatarFile = document.getElementById('avatarInput').files?.[0];
  const formData = new FormData();
  formData.append('name', name);
  if (avatarFile) formData.append('avatar', avatarFile);
  try {
    const data = await apiFetch('/admin/profile', { method: 'POST', body: formData });
    if (data.success) {
      const stored = getUser() || {};
      stored.name       = data.data.name;
      stored.avatar_url = data.data.avatar_url || null;
      localStorage.setItem('jn_admin_user', JSON.stringify(stored));
      // update sidebar live
      const nameEl = document.getElementById('sbUserName');
      if (nameEl) nameEl.textContent = data.data.name;
      const avatarEl = document.getElementById('sbUserAvatar');
      if (avatarEl && data.data.avatar_url) {
        avatarEl.innerHTML = `<img src="${data.data.avatar_url}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
      }
      toast('Profile updated');
    } else {
      toast(data.message || 'Update failed', 'error');
    }
  } catch { toast('Error updating profile', 'error'); }
}

// ── Font picker data ────────────────────────────────────────────────────────
const HINDI_FONTS = [
  { id: 'Noto Sans Devanagari', label: 'Noto Sans Devanagari', weights: 'wght@300;400;500;700;800', cat: 'Sans-serif', sample: 'जनबोल न्यूज़' },
  { id: 'Baloo 2',              label: 'Baloo 2',              weights: 'wght@400;500;600;700;800', cat: 'Display',    sample: 'जनबोल न्यूज़' },
  { id: 'Mukta',                label: 'Mukta',                weights: 'wght@300;400;500;700',     cat: 'Sans-serif', sample: 'जनबोल न्यूज़' },
  { id: 'Laila',                label: 'Laila',                weights: 'wght@400;600;700',         cat: 'Serif',      sample: 'जनबोल न्यूज़' },
  { id: 'Hind',                 label: 'Hind',                 weights: 'wght@300;400;500;600;700', cat: 'Sans-serif', sample: 'जनबोल न्यूज़' },
];
const ENGLISH_FONTS = [
  { id: 'Source Serif 4',   label: 'Source Serif 4',   weights: 'ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600', cat: 'Serif',      sample: 'Janbol News' },
  { id: 'Roboto',           label: 'Roboto',           weights: 'wght@300;400;500;700',                                cat: 'Sans-serif', sample: 'Janbol News' },
  { id: 'Inter',            label: 'Inter',            weights: 'wght@300;400;500;600;700',                            cat: 'Sans-serif', sample: 'Janbol News' },
  { id: 'Lato',             label: 'Lato',             weights: 'wght@300;400;700',                                    cat: 'Sans-serif', sample: 'Janbol News' },
  { id: 'Merriweather',     label: 'Merriweather',     weights: 'ital,wght@0,300;0,400;0,700',                         cat: 'Serif',      sample: 'Janbol News' },
  { id: 'Playfair Display', label: 'Playfair Display', weights: 'ital,wght@0,400;0,700;1,400',                         cat: 'Serif',      sample: 'Janbol News' },
];

let selectedFontHi = 'Baloo 2';
let selectedFontEn = 'Roboto';
let fontPreviewsLoaded = false;

function renderFontCards(fonts, type) {
  return fonts.map(f =>
    '<div class="font-card" data-type="' + type + '" data-font="' + f.id + '" onclick="selectFont(\'' + type + '\',\'' + f.id.replace(/'/g, "\\'") + '\')">' +
    '<div class="font-card-sample" style="font-family:\'' + f.id + '\',sans-serif;">' + f.sample + '</div>' +
    '<div class="font-card-name">' + f.label + '</div>' +
    '<div class="font-card-cat">' + f.cat + '</div>' +
    '<div class="font-card-check"><i class="fa-solid fa-check"></i></div>' +
    '</div>'
  ).join('');
}

function loadFontPreviews() {
  if (fontPreviewsLoaded) return;
  fontPreviewsLoaded = true;
  const all = [...HINDI_FONTS, ...ENGLISH_FONTS];
  const families = all.map(f => 'family=' + encodeURIComponent(f.id) + ':' + f.weights);
  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = 'https://fonts.googleapis.com/css2?' + families.join('&') + '&display=swap';
  document.head.appendChild(link);
}

function selectFont(type, fontId) {
  if (type === 'hi') selectedFontHi = fontId;
  else selectedFontEn = fontId;
  document.querySelectorAll('.font-card[data-type="' + type + '"]').forEach(el => {
    el.classList.toggle('selected', el.dataset.font === fontId);
  });
  updateFontPreview();
}

function updateFontCardSelection() {
  document.querySelectorAll('.font-card[data-type="hi"]').forEach(el => {
    el.classList.toggle('selected', el.dataset.font === selectedFontHi);
  });
  document.querySelectorAll('.font-card[data-type="en"]').forEach(el => {
    el.classList.toggle('selected', el.dataset.font === selectedFontEn);
  });
  updateFontPreview();
}

function updateFontPreview() {
  const hi = document.getElementById('fontPreviewHi');
  const en = document.getElementById('fontPreviewEn');
  const body = document.getElementById('fontPreviewBody');
  if (hi) hi.style.fontFamily = "'" + selectedFontHi + "', sans-serif";
  if (en) en.style.fontFamily = "'" + selectedFontEn + "', serif";
  if (body) body.style.fontFamily = "'" + selectedFontHi + "', sans-serif";
}

function render() {
  document.getElementById('pageBody').innerHTML = `
  <div class="settings-layout">
    <!-- Left nav -->
    <nav class="settings-nav" id="settingsNav">
      <a data-sec="profile" onclick="switchSection('profile')" class="active"><i class="fa-solid fa-user-circle"></i> My Profile</a>
      ${!isEditorRole ? `
      <a data-sec="general" onclick="switchSection('general')"><i class="fa-solid fa-gear"></i> General</a>
      <a data-sec="typography" onclick="switchSection('typography')"><i class="fa-solid fa-font"></i> Typography</a>
      <a data-sec="social" onclick="switchSection('social')"><i class="fa-solid fa-share-nodes"></i> Social Links</a>
      <a data-sec="analytics" onclick="switchSection('analytics')"><i class="fa-solid fa-chart-line"></i> Analytics</a>
      <a data-sec="adsense" onclick="switchSection('adsense')"><i class="fa-solid fa-rectangle-ad"></i> AdSense</a>
      <a data-sec="contact" onclick="switchSection('contact')"><i class="fa-solid fa-address-card"></i> Contact</a>
      ` : ''}
      <a data-sec="admin" onclick="switchSection('admin')"><i class="fa-solid fa-lock"></i> Admin Access</a>
    </nav>

    <!-- Settings panels -->
    <div id="settingsContent">

      <!-- Profile (all users) -->
      <div class="section-group active" data-section="profile" id="sec-profile">
        <div class="section-card">
          <div class="section-head"><i class="fa-solid fa-user-circle"></i><h3>My Profile</h3></div>
          <div class="section-body">
            <!-- Avatar -->
            <div style="display:flex;align-items:center;gap:20px;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid #f5f5f5;">
              <div style="position:relative;">
                <div id="avatarPreview" onclick="document.getElementById('avatarInput').click()" style="width:76px;height:76px;border-radius:50%;background:#C41E3A;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:800;color:#fff;overflow:hidden;border:3px solid #e5e5e5;cursor:pointer;letter-spacing:.5px;"></div>
                <div onclick="document.getElementById('avatarInput').click()" style="position:absolute;bottom:1px;right:1px;width:22px;height:22px;background:#1a1a1a;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #fff;cursor:pointer;">
                  <i class="fa-solid fa-camera" style="font-size:.5rem;color:#fff;"></i>
                </div>
              </div>
              <div>
                <div style="font-weight:700;font-size:.86rem;color:#333;">Profile Photo</div>
                <div style="font-size:.75rem;color:#aaa;margin-top:3px;">JPG, PNG or WebP · Max 2MB</div>
                <div style="font-size:.73rem;color:#C41E3A;margin-top:4px;cursor:pointer;font-weight:600;" onclick="document.getElementById('avatarInput').click()"><i class="fa-solid fa-arrow-up-from-bracket" style="margin-right:4px;"></i>Upload photo</div>
                <input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="previewAvatar(this)">
              </div>
            </div>
            <div class="field" style="max-width:380px;">
              <label>Full Name</label>
              <input type="text" id="profileName" placeholder="Your full name">
            </div>
            <div class="field" style="max-width:380px;">
              <label>Email Address</label>
              <input type="email" id="profileEmail" disabled style="background:#f9f9f9;color:#999;cursor:not-allowed;">
              <span class="hint">Email cannot be changed here</span>
            </div>
            <button class="btn-save" onclick="saveProfile()"><i class="fa-solid fa-floppy-disk"></i> Save Profile</button>
          </div>
        </div>
      </div>

      <!-- General (superadmin only) -->
      <div class="section-group" data-section="general" id="sec-general" ${isEditorRole ? 'style="display:none!important"' : ''}>
        <div class="section-card">
          <div class="section-head"><i class="fa-solid fa-newspaper"></i><h3>Site Identity</h3></div>
          <div class="section-body">
            <div class="grid-2">
              <div class="field">
                <label>Site Name (Hindi)</label>
                <input type="text" id="siteNameHi" class="hindi-input" placeholder="जनबोलन्यूज़">
              </div>
              <div class="field">
                <label>Site Name (English)</label>
                <input type="text" id="siteNameEn" placeholder="Janbolnews">
              </div>
            </div>
            <div class="grid-2">
              <div class="field">
                <label>Tagline (Hindi)</label>
                <input type="text" id="taglineHi" class="hindi-input" placeholder="आपकी आवाज़, सच की खबर">
              </div>
              <div class="field">
                <label>Tagline (English)</label>
                <input type="text" id="taglineEn" placeholder="Your Voice, True News">
              </div>
            </div>
            <div class="field">
              <label>Site Logo URL</label>
              <input type="url" id="logoUrl" placeholder="https://janbolnews.com/logo.png">
              <div class="hint">Leave empty to show text logo</div>
            </div>
            <div class="field">
              <label>Favicon URL</label>
              <input type="url" id="faviconUrl" placeholder="https://janbolnews.com/favicon.ico">
            </div>
            <button class="btn-save" id="btnSaveGeneral" onclick="saveSection('general')"><i class="fa-solid fa-floppy-disk"></i> Save General</button>
          </div>
        </div>

        <div class="section-card">
          <div class="section-head"><i class="fa-solid fa-bolt"></i><h3>Breaking Ticker</h3></div>
          <div class="section-body">
            <div class="grid-3">
              <div class="field">
                <label>Ticker Speed</label>
                <select id="tickerSpeed">
                  <option value="slow">Slow (40s)</option>
                  <option value="normal" selected>Normal (25s)</option>
                  <option value="fast">Fast (15s)</option>
                </select>
              </div>
              <div class="field">
                <label>Ticker BG Color</label>
                <input type="color" id="tickerColor" value="#C41E3A" style="height:40px;cursor:pointer;">
              </div>
              <div class="field">
                <label>Ticker Label</label>
                <input type="text" id="tickerLabel" placeholder="ब्रेकिंग न्यूज़" class="hindi-input">
              </div>
            </div>
            <button class="btn-save" onclick="saveSection('ticker')"><i class="fa-solid fa-floppy-disk"></i> Save Ticker</button>
          </div>
        </div>
      </div>

      <!-- Typography -->
      <div class="section-group" data-section="typography" id="sec-typography" ${isEditorRole ? 'style="display:none!important"' : ''}>
        <div class="section-card">
          <div class="section-head"><i class="fa-solid fa-font"></i><h3>Typography & Fonts</h3></div>
          <div class="section-body">

            <div class="font-section-label"><i class="fa-solid fa-language"></i>Hindi Font (हिंदी)</div>
            <div class="font-grid">${renderFontCards(HINDI_FONTS, 'hi')}</div>

            <div class="font-section-label"><i class="fa-solid fa-a"></i>English Font</div>
            <div class="font-grid">${renderFontCards(ENGLISH_FONTS, 'en')}</div>

            <div class="font-section-label"><i class="fa-solid fa-eye"></i>Live Preview</div>
            <div class="font-preview-box">
              <div class="font-preview-label" id="fontPreviewMeta">Hindi · English</div>
              <div class="font-preview-hi" id="fontPreviewHi">भारत की ताज़ा खबरें — जनबोल न्यूज़</div>
              <div class="font-preview-en" id="fontPreviewEn">Breaking News · Janbol News</div>
              <div class="font-preview-body" id="fontPreviewBody">IMF की रिपोर्ट के अनुसार भारत ने जापान को पीछे छोड़ते हुए दुनिया की चौथी सबसे बड़ी अर्थव्यवस्था का दर्जा हासिल किया।</div>
            </div>

            <button class="btn-save" onclick="saveSection('typography')"><i class="fa-solid fa-floppy-disk"></i> Save Typography</button>
          </div>
        </div>
      </div>

      <!-- Social Links -->
      <div class="section-group" data-section="social" id="sec-social">
        <div class="section-card">
          <div class="section-head"><i class="fa-solid fa-share-nodes"></i><h3>Social Media Links</h3></div>
          <div class="section-body">
            <div class="social-row">
              <div class="social-icon si-fb"><i class="fa-brands fa-facebook-f"></i></div>
              <input type="url" id="socialFb" placeholder="https://facebook.com/janbolnews">
            </div>
            <div class="social-row">
              <div class="social-icon si-tw"><i class="fa-brands fa-x-twitter"></i></div>
              <input type="url" id="socialTw" placeholder="https://x.com/janbolnews">
            </div>
            <div class="social-row">
              <div class="social-icon si-yt"><i class="fa-brands fa-youtube"></i></div>
              <input type="url" id="socialYt" placeholder="https://youtube.com/@janbolnews">
            </div>
            <div class="social-row">
              <div class="social-icon si-wa"><i class="fa-brands fa-whatsapp"></i></div>
              <input type="url" id="socialWa" placeholder="https://whatsapp.com/channel/…">
            </div>
            <div class="social-row">
              <div class="social-icon si-ig"><i class="fa-brands fa-instagram"></i></div>
              <input type="url" id="socialIg" placeholder="https://instagram.com/janbolnews">
            </div>
            <div style="margin-top:14px;">
              <button class="btn-save" onclick="saveSection('social')"><i class="fa-solid fa-floppy-disk"></i> Save Social Links</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Analytics -->
      <div class="section-group" data-section="analytics" id="sec-analytics">
        <div class="section-card">
          <div class="section-head"><i class="fa-solid fa-chart-line"></i><h3>Google Analytics</h3></div>
          <div class="section-body">
            <div class="field">
              <label>Google Analytics Measurement ID</label>
              <input type="text" id="gaId" placeholder="G-XXXXXXXXXX">
              <div class="hint">Format: G-XXXXXXXXXX (GA4) or UA-XXXXXXXX-X (Universal Analytics)</div>
            </div>
            <div class="field">
              <label>Google Tag Manager ID (Optional)</label>
              <input type="text" id="gtmId" placeholder="GTM-XXXXXXX">
            </div>
            <button class="btn-save" onclick="saveSection('analytics')"><i class="fa-solid fa-floppy-disk"></i> Save Analytics</button>
          </div>
        </div>
      </div>

      <!-- AdSense -->
      <div class="section-group" data-section="adsense" id="sec-adsense">
        <div class="section-card">
          <div class="section-head"><i class="fa-solid fa-rectangle-ad"></i><h3>Google AdSense</h3></div>
          <div class="section-body">
            <div class="field" style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#f9f9f9;border-radius:8px;border:1.5px solid #e5e5e5;">
              <div>
                <div style="font-weight:700;font-size:.88rem;color:#1a1a1a;">Enable Ads</div>
                <div class="hint" style="margin:0;">Turn off to hide all ad slots site-wide</div>
              </div>
              <label class="toggle" style="margin:0;">
                <input type="checkbox" id="adsEnabled" onchange="document.getElementById('adsEnabled').value=this.checked?'1':'0'">
                <span class="toggle-slider"></span>
              </label>
            </div>
            <div class="field">
              <label>AdSense Publisher ID</label>
              <input type="text" id="adsenseId" placeholder="ca-pub-XXXXXXXXXXXXXXXX">
              <div class="hint">Your ca-pub ID from AdSense dashboard</div>
            </div>
            <div class="field">
              <label>Header Ad Code</label>
              <textarea id="adsenseHeader" placeholder='&lt;ins class="adsbygoogle"&#10;  style="display:block"&#10;  data-ad-client="ca-pub-..."&#10;  data-ad-slot="..."&gt;&lt;/ins&gt;'></textarea>
              <div class="hint">Appears above all pages in the site header</div>
              <div class="adsense-preview" id="previewHeader">Paste code above to preview</div>
            </div>
            <div class="field">
              <label>Sidebar Ad Code</label>
              <textarea id="adsenseSidebar" placeholder='&lt;ins class="adsbygoogle" ...&gt;&lt;/ins&gt;'></textarea>
              <div class="hint">Appears in article/page sidebar</div>
            </div>
            <div class="field">
              <label>In-Article Ad Code</label>
              <textarea id="adsenseArticle" placeholder='&lt;ins class="adsbygoogle" ...&gt;&lt;/ins&gt;'></textarea>
              <div class="hint">Injected within article content (after 3rd paragraph)</div>
            </div>
            <button class="btn-save" onclick="saveSection('adsense')"><i class="fa-solid fa-floppy-disk"></i> Save AdSense</button>
          </div>
        </div>
      </div>

      <!-- Contact -->
      <div class="section-group" data-section="contact" id="sec-contact">
        <div class="section-card">
          <div class="section-head"><i class="fa-solid fa-address-card"></i><h3>Contact Information</h3></div>
          <div class="section-body">
            <div class="grid-2">
              <div class="field">
                <label>Contact Email</label>
                <input type="email" id="contactEmail" placeholder="editor@janbolnews.com">
              </div>
              <div class="field">
                <label>Contact Phone</label>
                <input type="tel" id="contactPhone" placeholder="+91 XXXXX XXXXX">
              </div>
            </div>
            <div class="field">
              <label>Office Address (Hindi)</label>
              <input type="text" id="addressHi" class="hindi-input" placeholder="कार्यालय का पता…">
            </div>
            <div class="field">
              <label>Office Address (English)</label>
              <input type="text" id="addressEn" placeholder="Office address in English…">
            </div>
            <button class="btn-save" onclick="saveSection('contact')"><i class="fa-solid fa-floppy-disk"></i> Save Contact Info</button>
          </div>
        </div>
      </div>

      <!-- Admin Access -->
      <div class="section-group ${isEditorRole ? 'active' : ''}" data-section="admin" id="sec-admin">
        <div class="section-card danger-zone">
          <div class="section-head danger-head"><i class="fa-solid fa-shield-halved"></i><h3>Admin Access</h3></div>
          <div class="section-body">
            <div class="field" style="max-width:380px;">
              <label>Current Password</label>
              <input type="password" id="currentPassword" placeholder="Current admin password" autocomplete="current-password">
            </div>
            <div class="field" style="max-width:380px;">
              <label>New Password</label>
              <input type="password" id="newPassword" placeholder="New password (min 8 chars)" autocomplete="new-password">
            </div>
            <div class="field" style="max-width:380px;">
              <label>Confirm New Password</label>
              <input type="password" id="confirmPassword" placeholder="Repeat new password" autocomplete="new-password">
            </div>
            <button class="btn-save" onclick="changePassword()" style="background:#1a1a1a;"><i class="fa-solid fa-key"></i> Change Password</button>
            <div style="margin-top:14px;padding-top:14px;border-top:1px solid #f0f0f0;">
              <button class="btn-save" onclick="if(confirm('Log out of all sessions?')) logout();" style="background:#888;"><i class="fa-solid fa-right-from-bracket"></i> Logout Now</button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>`;

  // AdSense preview live
  document.getElementById('adsenseHeader').addEventListener('input', function() {
    document.getElementById('previewHeader').textContent = this.value || 'Paste code above to preview';
  });

  loadProfileSection();
  if (!isEditorRole) loadSettings();
}

function switchSection(sec) {
  currentSection = sec;
  document.querySelectorAll('.settings-nav a').forEach(a => a.classList.toggle('active', a.dataset.sec === sec));
  document.querySelectorAll('.section-group').forEach(el => el.classList.toggle('active', el.dataset.section === sec));
  if (sec === 'profile') loadProfileSection();
  if (sec === 'typography') { loadFontPreviews(); setTimeout(() => { updateFontCardSelection(); }, 80); }
}

async function loadSettings() {
  try {
    const data = await apiFetch('/admin/settings');
    settingsData = data.data || {};
    populateFields();
  } catch (e) {
    // Fields stay empty, user can fill and save
  }
}

function populateFields() {
  const s = settingsData;
  const set = (id, val) => { const el = document.getElementById(id); if (el && val !== undefined) el.value = val || ''; };
  set('siteNameHi',    s.site_name_hi);
  set('siteNameEn',    s.site_name_en);
  set('taglineHi',     s.tagline_hi);
  set('taglineEn',     s.tagline_en);
  set('logoUrl',       s.logo_url);
  set('faviconUrl',    s.favicon_url);
  set('tickerSpeed',   s.ticker_speed);
  set('tickerColor',   s.ticker_color || '#C41E3A');
  set('tickerLabel',   s.ticker_label);
  set('socialFb',      s.social_facebook);
  set('socialTw',      s.social_twitter);
  set('socialYt',      s.social_youtube);
  set('socialWa',      s.social_whatsapp);
  set('socialIg',      s.social_instagram);
  set('gaId',          s.ga_id);
  set('gtmId',         s.gtm_id);
  const adsEnabledEl = document.getElementById('adsEnabled');
  if (adsEnabledEl) { adsEnabledEl.checked = s.ads_enabled !== '0' && s.ads_enabled !== 'false'; }
  set('adsenseId',     s.adsense_id);
  set('adsenseHeader', s.adsense_header);
  set('adsenseSidebar',s.adsense_sidebar);
  set('adsenseArticle',s.adsense_article);
  set('contactEmail',  s.contact_email);
  set('contactPhone',  s.contact_phone);
  set('addressHi',     s.address_hi);
  set('addressEn',     s.address_en);
  if (s.font_hi) selectedFontHi = s.font_hi;
  if (s.font_en) selectedFontEn = s.font_en;
  updateFontCardSelection();
}

async function saveSection(section) {
  const btnId = `btnSave${section.charAt(0).toUpperCase()+section.slice(1)}`;
  const btn = document.getElementById(btnId) || document.querySelector(`[onclick="saveSection('${section}')"]`);
  const origHtml = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving…'; }

  const payload = {};

  if (section === 'general' || section === 'ticker') {
    const safeVal = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
    if (section === 'general') {
      Object.assign(payload, {
        site_name_hi: safeVal('siteNameHi'), site_name_en: safeVal('siteNameEn'),
        tagline_hi: safeVal('taglineHi'), tagline_en: safeVal('taglineEn'),
        logo_url: safeVal('logoUrl'), favicon_url: safeVal('faviconUrl'),
      });
    } else {
      Object.assign(payload, {
        ticker_speed: safeVal('tickerSpeed'), ticker_color: safeVal('tickerColor'),
        ticker_label: safeVal('tickerLabel'),
      });
    }
  }

  if (section === 'social') {
    Object.assign(payload, {
      social_facebook: document.getElementById('socialFb').value.trim(),
      social_twitter: document.getElementById('socialTw').value.trim(),
      social_youtube: document.getElementById('socialYt').value.trim(),
      social_whatsapp: document.getElementById('socialWa').value.trim(),
      social_instagram: document.getElementById('socialIg').value.trim(),
    });
  }

  if (section === 'analytics') {
    Object.assign(payload, {
      ga_id:  document.getElementById('gaId').value.trim(),
      gtm_id: document.getElementById('gtmId').value.trim(),
    });
  }

  if (section === 'adsense') {
    Object.assign(payload, {
      ads_enabled:     document.getElementById('adsEnabled').checked ? '1' : '0',
      adsense_id:      document.getElementById('adsenseId').value.trim(),
      adsense_header:  document.getElementById('adsenseHeader').value.trim(),
      adsense_sidebar: document.getElementById('adsenseSidebar').value.trim(),
      adsense_article: document.getElementById('adsenseArticle').value.trim(),
    });
  }

  if (section === 'contact') {
    Object.assign(payload, {
      contact_email: document.getElementById('contactEmail').value.trim(),
      contact_phone: document.getElementById('contactPhone').value.trim(),
      address_hi:    document.getElementById('addressHi').value.trim(),
      address_en:    document.getElementById('addressEn').value.trim(),
    });
  }

  if (section === 'typography') {
    Object.assign(payload, { font_hi: selectedFontHi, font_en: selectedFontEn });
    // Update public-site cache so changes are reflected immediately in this browser
    try { localStorage.setItem('jn_fonts', JSON.stringify({ font_hi: selectedFontHi, font_en: selectedFontEn, ts: Date.now() })); } catch(e) {}
  }

  try {
    const r = await apiFetch('/admin/settings', { method: 'POST', body: JSON.stringify(payload) });
    toast(r.success ? 'Settings saved!' : (r.message || 'Saved (check api/config.php to persist)'), r.success ? 'success' : 'warning');
  } catch { toast('Error saving settings', 'error'); }
  finally {
    if (btn) { btn.disabled = false; btn.innerHTML = origHtml; }
  }
}

async function changePassword() {
  const current = document.getElementById('currentPassword').value;
  const newPass = document.getElementById('newPassword').value;
  const confirm = document.getElementById('confirmPassword').value;

  if (!current) { toast('Enter current password', 'error'); return; }
  if (!newPass || newPass.length < 8) { toast('New password must be at least 8 characters', 'error'); return; }
  if (newPass !== confirm) { toast('Passwords do not match', 'error'); return; }

  try {
    const r = await apiFetch('/admin/profile/password', { method: 'PUT', body: JSON.stringify({ current_password: current, new_password: newPass, new_password_confirmation: confirm }) });
    if (r.success) {
      toast('Password changed! Please log in again.');
      setTimeout(logout, 1500);
    } else {
      toast(r.message || 'Password change failed', 'error');
    }
  } catch { toast('Error', 'error'); }
}

render();
</script>
</body>
</html>
